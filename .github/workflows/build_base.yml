name: VIIPER Build Base

on:
    workflow_call:
        inputs:
            artifact_suffix:
                required: false
                type: string
                default: ""
                description: "Suffix to add to artifact names"
            upload_artifacts:
                required: false
                type: boolean
                default: false
                description: "Whether to upload build artifacts"

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: stable
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@v3

            - name: Install goversioninfo (Windows)
              if: ${{ matrix.target.goos == 'windows' }}
              shell: pwsh
              run: |
                  go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

            - name: Show Go version
              run: go version

            - name: Lint
              uses: golangci/golangci-lint-action@v9.2.0
              with:
                  version: latest
                  install-mode: goinstall

            - name: Run tests
              run: just test-coverage

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  directory: .
                  fail_ci_if_error: false

    build:
        name: Build binaries (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
        runs-on: ${{ matrix.target.runner }}
        needs: test
        strategy:
            fail-fast: false
            matrix:
                target:
                    - { goos: linux, goarch: amd64, ext: "", runner: ubuntu-latest }
                    - { goos: linux, goarch: arm64, ext: "", runner: ubuntu-latest }
                    - { goos: windows, goarch: amd64, ext: ".exe", runner: windows-latest }
                    - { goos: windows, goarch: arm64, ext: ".exe", runner: windows-latest }
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: 1.26
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@v3

            - name: Install goversioninfo
              shell: pwsh
              run: |
                  go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

            - name: Build
              env:
                  GOOS: ${{ matrix.target.goos }}
                  GOARCH: ${{ matrix.target.goarch }}
                  CGO_ENABLED: 0
                  BUILD_TYPE: Release
                  OUTPUT_NAME: viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ matrix.target.ext }}
              run: |
                  just build Release

            - name: Package (Linux)
              if: ${{ matrix.target.goos == 'linux' }}
              shell: bash
              run: |
                  set -euo pipefail
                  rm -rf dist/package
                  mkdir -p dist/package
                  cp dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }} dist/package/viiper
                  cp dist/licenses.txt dist/package/licenses.txt
                  tar -czf dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.tar.gz -C dist/package viiper licenses.txt

            - name: Package (Windows)
              if: ${{ matrix.target.goos == 'windows' }}
              shell: pwsh
              run: |
                  Remove-Item -Recurse -Force dist/package -ErrorAction SilentlyContinue
                  New-Item -ItemType Directory -Force -Path dist/package | Out-Null
                  Copy-Item dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ matrix.target.ext }} dist/package/viiper.exe -Force
                  Copy-Item dist/licenses.txt dist/package/licenses.txt -Force
                  Compress-Archive -Path dist/package/viiper.exe, dist/package/licenses.txt -DestinationPath dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.zip -Force

            - name: Upload artifact (Linux)
              if: ${{ inputs.upload_artifacts && matrix.target.goos == 'linux' }}
              uses: actions/upload-artifact@v7
              with:
                  name: VIIPER-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ inputs.artifact_suffix }}
                  path: dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.tar.gz
                  if-no-files-found: error

            - name: Upload artifact (Windows)
              if: ${{ inputs.upload_artifacts && matrix.target.goos == 'windows' }}
              uses: actions/upload-artifact@v7
              with:
                  name: VIIPER-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ inputs.artifact_suffix }}
                  path: dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.zip
                  if-no-files-found: error

    canonical-libviiper-test:
        name: Validate canonical libVIIPER
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: 1.26
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run focused tests
              run: go test ./device/steamcontroller ./device/steamdeck ./lib/viiper ./internal/server/usb ./virtualbus

            - name: Run lifecycle race tests
              run: go test -race ./device/steamcontroller ./device/steamdeck ./lib/viiper

            - name: Run Steam Deck C callback bridge tests
              run: go test -tags viiper_testbridge ./lib/viiper

            - name: Vet canonical packages
              run: go vet ./device/steamcontroller ./device/steamdeck ./lib/viiper ./internal/server/usb ./virtualbus

            - name: Test manifest scripts
              shell: pwsh
              run: |
                  ./scripts/tests/test-libviiper-manifest.ps1

    libviiper-linux:
        name: Build libVIIPER (linux/amd64)
        runs-on: ubuntu-latest
        needs: canonical-libviiper-test
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: 1.26
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@v3

            - name: Build
              run: |
                  just build-libVIIPER Release

            - name: Package
              run: cd dist/libVIIPER && zip libVIIPER-linux-amd64.zip libVIIPER.so libVIIPER.h licenses.txt

            - name: Upload artifact
              if: ${{ inputs.upload_artifacts }}
              uses: actions/upload-artifact@v7
              with:
                  name: libVIIPER-linux-amd64${{ inputs.artifact_suffix }}
                  path: dist/libVIIPER/libVIIPER-linux-amd64.zip
                  if-no-files-found: error

    libviiper-windows:
        name: Build libVIIPER (windows/amd64)
        runs-on: windows-latest
        needs:
            - test
            - canonical-libviiper-test
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: 1.26
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@v3

            - name: Install build tools
              shell: pwsh
              run: |
                  winget install -e --id MartinStorsjo.LLVM-MinGW.UCRT --accept-package-agreements --accept-source-agreements
                  winget install -e --id Kitware.CMake --accept-package-agreements --accept-source-agreements
                  if (Test-Path "C:\Program Files\LLVM-MinGW\bin") {
                    "C:\Program Files\LLVM-MinGW\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
                  }
                  exit 0

            - name: Build
              shell: bash
              run: |
                  just build-libVIIPER Release

            - name: Verify canonical C ABI
              shell: bash
              run: |
                  set -euo pipefail
                  grep -Eq 'GetUSBDeviceIdentity\(uintptr_t handle, uint32_t\* outBusID, uint32_t\* outDeviceID\)' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'AttachUSBDevice\(uintptr_t handle\)' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'DetachUSBDevice\(uintptr_t handle\)' dist/libVIIPER/libVIIPER.h
                  grep -q 'USBDeviceAttachResult' dist/libVIIPER/libVIIPER.h
                  grep -q 'USBDeviceDetachResult' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'VIIPER_ATTACH_SUCCESS = 0' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'VIIPER_ATTACH_RETRYABLE_FAILURE = 1' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'VIIPER_ATTACH_UNSAFE_OUTCOME_UNKNOWN = 2' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'VIIPER_ATTACH_INVALID = 3' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'VIIPER_DETACH_SUCCESS = 0' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'VIIPER_DETACH_RETRYABLE_FAILURE = 1' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'VIIPER_DETACH_UNSAFE_OUTCOME_UNKNOWN = 2' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'VIIPER_DETACH_INVALID = 3' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern USBDeviceAttachResult AttachUSBDeviceEx\(uintptr_t handle\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern USBDeviceDetachResult DetachUSBDeviceEx\(uintptr_t handle\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern _Bool AttachUSBDevice\(uintptr_t handle\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern _Bool DetachUSBDevice\(uintptr_t handle\);' dist/libVIIPER/libVIIPER.h
                  grep -q 'USBDeviceAttachmentState' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'VIIPER_ATTACHMENT_DETACHED = 0' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'VIIPER_ATTACHMENT_ATTACHED = 1' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'VIIPER_ATTACHMENT_OUTCOME_UNKNOWN = 2' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern _Bool GetUSBDeviceAttachmentState\(uintptr_t handle, USBDeviceAttachmentState\* outState\);' dist/libVIIPER/libVIIPER.h
                  grep -q 'SteamControllerDeviceHandle' dist/libVIIPER/libVIIPER.h
                  grep -q 'SteamControllerDeviceState' dist/libVIIPER/libVIIPER.h
                  grep -q 'SteamControllerOutputCallback' dist/libVIIPER/libVIIPER.h
                  grep -q 'CreateSteamControllerDevice' dist/libVIIPER/libVIIPER.h
                  grep -q 'SetSteamControllerDeviceState' dist/libVIIPER/libVIIPER.h
                  grep -q 'SetSteamControllerOutputCallback' dist/libVIIPER/libVIIPER.h
                  grep -q 'RemoveSteamControllerDevice' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'typedef void \(\*SteamControllerOutputCallback\)\(SteamControllerDeviceHandle handle, const uint8_t\* data, uint32_t length\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern GoUint8 CreateSteamControllerDevice\(USBServerHandle serverHandle, SteamControllerDeviceHandle\* outDeviceHandle, GoUint32 busID, GoUint8 autoAttachLocalhost, GoUint16 idVendor, GoUint16 idProduct\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern GoUint8 SetSteamControllerDeviceState\(SteamControllerDeviceHandle handle, SteamControllerDeviceState state\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern GoUint8 SetSteamControllerOutputCallback\(SteamControllerDeviceHandle handle, SteamControllerOutputCallback cb\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern GoUint8 RemoveSteamControllerDevice\(SteamControllerDeviceHandle handle\);' dist/libVIIPER/libVIIPER.h
                  grep -q 'SteamDeckDeviceHandle' dist/libVIIPER/libVIIPER.h
                  grep -q 'SteamDeckDeviceState' dist/libVIIPER/libVIIPER.h
                  grep -q 'SteamDeckDeviceRemoveResult' dist/libVIIPER/libVIIPER.h
                  grep -q 'CreateSteamDeckDevice' dist/libVIIPER/libVIIPER.h
                  grep -q 'SetSteamDeckDeviceState' dist/libVIIPER/libVIIPER.h
                  grep -q 'RemoveSteamDeckDevice' dist/libVIIPER/libVIIPER.h
                  grep -q 'RemoveSteamDeckDeviceEx' dist/libVIIPER/libVIIPER.h
                  grep -q 'SteamDeckOutputCallback' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'typedef void \(\*SteamDeckOutputCallback\)\(SteamDeckDeviceHandle handle, const uint8_t\* data, uint32_t length\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern GoUint8 SetSteamDeckOutputCallback\(SteamDeckDeviceHandle handle, SteamDeckOutputCallback cb\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern GoUint8 CreateSteamDeckDevice\(USBServerHandle serverHandle, SteamDeckDeviceHandle\* outDeviceHandle, GoUint32 busID, GoUint8 autoAttachLocalhost, GoUint16 idVendor, GoUint16 idProduct\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern GoUint8 SetSteamDeckDeviceState\(SteamDeckDeviceHandle handle, SteamDeckDeviceState state\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern GoUint8 RemoveSteamDeckDevice\(SteamDeckDeviceHandle handle\);' dist/libVIIPER/libVIIPER.h
                  grep -Eq 'extern SteamDeckDeviceRemoveResult RemoveSteamDeckDeviceEx\(SteamDeckDeviceHandle handle\);' dist/libVIIPER/libVIIPER.h
                  export_tool="$(command -v llvm-objdump || command -v objdump)"
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'GetUSBDeviceIdentity'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -qE '\bAttachUSBDevice$'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -qE '\bDetachUSBDevice$'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'AttachUSBDeviceEx'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'DetachUSBDeviceEx'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'GetUSBDeviceAttachmentState'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'CreateSteamControllerDevice'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'SetSteamControllerDeviceState'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'SetSteamControllerOutputCallback'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'RemoveSteamControllerDevice'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'CreateSteamDeckDevice'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'SetSteamDeckDeviceState'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'RemoveSteamDeckDevice'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'RemoveSteamDeckDeviceEx'
                  "$export_tool" -p dist/libVIIPER/libVIIPER.dll | grep -q 'SetSteamDeckOutputCallback'

            - name: Verify canonical generated header has no trailing whitespace
              shell: bash
              run: |
                  set -euo pipefail
                  if grep -nE '[[:blank:]]+$' dist/libVIIPER/libVIIPER.h; then
                    echo "::error::dist/libVIIPER/libVIIPER.h contains trailing whitespace on the lines above"
                    exit 1
                  fi

            - name: Generate canonical artifact manifest
              shell: pwsh
              run: |
                  ./scripts/generate-libviiper-manifest.ps1 `
                      -DllPath dist/libVIIPER/libVIIPER.dll `
                      -HeaderPath dist/libVIIPER/libVIIPER.h `
                      -OutputPath dist/libVIIPER/viiper-artifact.json

            - name: Verify canonical artifact manifest
              shell: pwsh
              run: |
                  ./scripts/verify-libviiper-manifest.ps1 `
                      -ManifestPath dist/libVIIPER/viiper-artifact.json `
                      -DllPath dist/libVIIPER/libVIIPER.dll `
                      -HeaderPath dist/libVIIPER/libVIIPER.h

            - name: Package
              shell: pwsh
              run: |
                  Compress-Archive -Path dist/libVIIPER/libVIIPER.dll, dist/libVIIPER/libVIIPER.def, dist/libVIIPER/libVIIPER.h, dist/libVIIPER/licenses.txt, dist/libVIIPER/viiper-artifact.json -DestinationPath dist/libVIIPER/libVIIPER-windows-amd64.zip -Force

            - name: Upload artifact
              if: ${{ inputs.upload_artifacts }}
              uses: actions/upload-artifact@v7
              with:
                  name: libVIIPER-windows-amd64${{ inputs.artifact_suffix }}
                  path: dist/libVIIPER/libVIIPER-windows-amd64.zip
                  if-no-files-found: error
