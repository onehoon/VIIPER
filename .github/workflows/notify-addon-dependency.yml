name: Notify Addon Dependency

# Fires only after a successful main-branch "Dev Snapshot Build" push run and
# tells SteamInputAddonforClaw's receiver which exact VIIPER commit produced
# a new canonical artifact. This dispatch is a hint/input only: it carries no
# adoption authority. The Addon receiver independently rediscovers and
# re-verifies the exact push/main/success canonical artifact, its manifest,
# and its hashes before adopting anything, and it never auto-merges.

on:
  workflow_run:
    workflows: ["Dev Snapshot Build"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate source commit SHA
        id: sha
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::workflow_run.head_sha is not exactly 40 hexadecimal characters: '$HEAD_SHA'"
            exit 1
          fi
          echo "commit=${HEAD_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.VIIPER_ADDON_BOT_CLIENT_ID }}
          private-key: ${{ secrets.VIIPER_ADDON_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            SteamInputAddonforClaw
          permission-contents: write

      - name: Dispatch viiper-canonical-ready
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT: ${{ steps.sha.outputs.commit }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/onehoon/SteamInputAddonforClaw/dispatches \
            -f event_type='viiper-canonical-ready' \
            -f "client_payload[commit]=${COMMIT}" \
            -f "client_payload[source_run_id]=${SOURCE_RUN_ID}"
